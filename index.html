<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>後出しじゃんけん</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- モード選択 -->
<div id="modeScreen">
  <h1>後出しじゃんけん ✊✌️✋</h1>

  <div class="mode-buttons">
    <button onclick="unlockAudio(); startGame(1)">モード1（勝ち）</button>
    <button onclick="unlockAudio(); startGame(2)">モード2（負け）</button>
    <button onclick="unlockAudio(); startGame(3)">モード3（ランダム）</button>
    <button onclick="unlockAudio(); startGame(4)">モード4（応用）</button>
  </div>
</div>

<!-- ゲーム画面 -->
<div id="gameScreen" class="hidden">

  <div id="cpuHandImg">✊</div>

  <div id="result"></div>

  <div class="player-buttons"></div>

  <!-- 🔥 追加：大結果表示 -->
  <div id="bigResult" class="hidden"></div>

</div>

<!-- 結果画面 -->
<div id="resultScreen" class="hidden">

  <div id="finalMessage"></div>
  <div id="finalScore"></div>
  <div id="finalTime"></div>

  <button onclick="restartGame()">もう一度遊ぶ</button>

</div>

<!-- 音 -->
<audio id="soundCorrect" src="correct2.mp3"></audio>
<audio id="soundResult" src="result.mp3"></audio>

<script src="script.js"></script>
</body>
</html>
